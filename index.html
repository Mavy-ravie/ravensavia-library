<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ravensavaia PDF Library</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #1f6feb;
        --primary-dark: #134ea8;
        --text: #1d2430;
        --muted: #5d6b82;
        --border: #dfe8f4;
        --shadow: 0 14px 35px rgba(31, 111, 235, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #edf4ff 0%, var(--bg) 60%);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }

      header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        border-radius: 24px;
        padding: 36px 30px;
        box-shadow: var(--shadow);
      }

      header h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      header p {
        margin: 12px 0 0;
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .toolbar {
        margin-top: 26px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
      }

      .search-box {
        width: min(100%, 380px);
      }

      .search-box input {
        width: 100%;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--card);
        box-shadow: 0 6px 18px rgba(24, 36, 52, 0.04);
        font-size: 1rem;
      }

      .add-form {
        margin-top: 30px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 10px 22px rgba(22, 35, 51, 0.04);
      }

      .add-form h2 {
        margin: 0 0 18px;
        font-size: 1.4rem;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field label {
        font-weight: 700;
        color: var(--muted);
      }

      .field input,
      .field textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
      }

      .field textarea {
        resize: vertical;
        min-height: 90px;
      }

      .form-actions {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
      }

      .button {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 0.98rem;
        font-weight: 700;
        cursor: pointer;
      }

      .button.secondary {
        background: #edf4ff;
        color: var(--primary-dark);
      }

      .note {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .stats {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 30px;
      }

      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 22px;
        min-width: 130px;
        box-shadow: 0 10px 22px rgba(22, 35, 51, 0.04);
      }

      .stat strong {
        display: block;
        font-size: 1.7rem;
        color: var(--primary);
      }

      .stat span {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .category {
        margin-top: 38px;
      }

      .category h2 {
        margin-bottom: 18px;
        font-size: 1.6rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 18px;
      }

      .pdf-card {
        display: block;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px;
        text-decoration: none;
        color: var(--text);
        box-shadow: 0 10px 22px rgba(22, 35, 51, 0.04);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .pdf-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 30px rgba(31, 111, 235, 0.12);
        border-color: #afd1ff;
      }

      .tag {
        display: inline-block;
        background: #eaf3ff;
        color: var(--primary-dark);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .pdf-card h3 {
        margin: 14px 0 8px;
        font-size: 1.08rem;
      }

      .pdf-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .pdf-card .open {
        display: inline-block;
        margin-top: 14px;
        font-weight: 700;
        color: var(--primary);
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 640px) {
        header {
          padding: 28px 20px;
        }

        .toolbar {
          align-items: stretch;
        }

        .search-box {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Ravensavaia PDF Library</h1>
        <p>Organize your study materials in one easy place.</p>
      </header>

      <div class="toolbar">
        <div class="search-box">
          <input type="search" id="searchInput" placeholder="Search PDFs by name or topic..." />
        </div>
      </div>

      <form id="addPdfForm" class="add-form">
        <h2>Add a new PDF</h2>
        <div class="form-grid">
          <div class="field">
            <label for="pdfTitle">PDF Title</label>
            <input id="pdfTitle" type="text" placeholder="Example: BIO 101 notes" required />
          </div>

          <div class="field">
            <label for="pdfSection">Section</label>
            <input id="pdfSection" type="text" placeholder="Example: Course Notes" required />
          </div>

          <div class="field">
            <label for="pdfTag">Tag</label>
            <input id="pdfTag" type="text" placeholder="Example: Biology" required />
          </div>

          <div class="field">
            <label for="pdfFilename">PDF file name or link</label>
            <input id="pdfFilename" type="text" placeholder="Example: BIO 101 notes.pdf" />
          </div>

          <div class="field" style="grid-column: 1 / -1;">
            <label for="pdfDescription">Description</label>
            <textarea id="pdfDescription" placeholder="Short description of this PDF"></textarea>
          </div>

          <div class="field" style="grid-column: 1 / -1;">
            <label for="pdfFile">Or upload a PDF file</label>
            <input id="pdfFile" type="file" accept="application/pdf" />
          </div>
        </div>

        <div class="form-actions">
          <button class="button" type="submit">Add PDF</button>
          <button class="button secondary" type="button" id="clearLibraryBtn">Clear My PDFs</button>
          <span class="note">Tip: If you choose a file, it will stay in this browser for later viewing.</span>
        </div>
      </form>

      <div class="stats">
        <div class="stat">
          <strong id="pdfCount">0</strong>
          <span>Saved PDFs</span>
        </div>
        <div class="stat">
          <strong id="sectionCount">0</strong>
          <span>Sections</span>
        </div>
      </div>

      <div id="pdfContainer"></div>
    </div>

    <script>
      const STORAGE_KEY = 'ravensavaia_pdf_library_v2';
      let myPdfs = loadMyPdfs();

      const pdfContainer = document.getElementById('pdfContainer');
      const pdfCount = document.getElementById('pdfCount');
      const sectionCount = document.getElementById('sectionCount');
      const searchInput = document.getElementById('searchInput');
      const addPdfForm = document.getElementById('addPdfForm');
      const clearLibraryBtn = document.getElementById('clearLibraryBtn');

      function loadMyPdfs() {
        try {
          const savedPdfs = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return Array.isArray(savedPdfs) ? savedPdfs : [];
        } catch (error) {
          return [];
        }
      }

      function groupPdfsBySection(items) {
        return items.reduce((groups, item) => {
          if (!groups[item.section]) groups[item.section] = [];
          groups[item.section].push(item);
          return groups;
        }, {});
      }

      function renderLibrary() {
        const grouped = groupPdfsBySection(myPdfs);

        const sectionsHtml = Object.entries(grouped)
          .map(([section, items]) => {
            const cardsHtml = items
              .map(
                (item) => `
                  <a class="pdf-card" href="${item.href}" target="_blank" rel="noopener">
                    <span class="tag">${item.subject}</span>
                    <h3>${item.title}</h3>
                    <p>${item.description || `${item.year || ''} ${item.size || ''}`.trim() || 'Study material.'}</p>
                    <span class="open">Open PDF →</span>
                  </a>
                `
              )
              .join('');

            return `
              <section class="category">
                <h2>${section}</h2>
                <div class="grid">${cardsHtml}</div>
              </section>
            `;
          })
          .join('');

        pdfContainer.innerHTML = sectionsHtml;
        pdfCount.textContent = myPdfs.length;
        sectionCount.textContent = Object.keys(grouped).length;

        const pdfCards = document.querySelectorAll('.pdf-card');
        const searchTerm = searchInput.value.trim().toLowerCase();

        pdfCards.forEach((card) => {
          const content = card.textContent.toLowerCase();
          card.classList.toggle('hidden', searchTerm && !content.includes(searchTerm));
        });
      }

      function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('Could not read the selected file.'));
          reader.readAsDataURL(file);
        });
      }

      async function handleAddPdf(event) {
        event.preventDefault();

        const title = document.getElementById('pdfTitle').value.trim();
        const section = document.getElementById('pdfSection').value.trim();
        const tag = document.getElementById('pdfTag').value.trim();
        const description = document.getElementById('pdfDescription').value.trim();
        const filenameInput = document.getElementById('pdfFilename').value.trim();
        const uploadedFile = document.getElementById('pdfFile').files[0];

        if (!title || !section || !tag) {
          alert('Please fill in the title, section, and tag fields.');
          return;
        }

        if (!uploadedFile && !filenameInput) {
          alert('Please enter a PDF file name/link or upload a PDF file.');
          return;
        }

        const newPdf = {
          id: Date.now(),
          title,
          subject: section,
          year: new Date().getFullYear().toString(),
          size: uploadedFile ? `${(uploadedFile.size / 1024 / 1024).toFixed(1)} MB` : '',
          tag,
          description: description || 'Added to your school PDF library.',
          href: filenameInput || '#'
        };

        if (uploadedFile) {
          try {
            newPdf.href = await readFileAsDataURL(uploadedFile);
            newPdf.fileName = uploadedFile.name;
          } catch (error) {
            alert(error.message);
            return;
          }
        }

        myPdfs.push(newPdf);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(myPdfs));
        } catch (error) {
          myPdfs.pop();
          alert('This PDF could not be saved. The browser storage may be full.');
          return;
        }
        addPdfForm.reset();
        renderLibrary();
      }

      function clearLibrary() {
        localStorage.removeItem(STORAGE_KEY);
        myPdfs = [];
        renderLibrary();
      }

      searchInput.addEventListener('input', renderLibrary);
      addPdfForm.addEventListener('submit', handleAddPdf);
      clearLibraryBtn.addEventListener('click', clearLibrary);

      renderLibrary();
    </script>
  </body>
</html>
